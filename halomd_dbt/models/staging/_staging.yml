version: 2
models:
  - name: stg_claims
    description: "Cleaned claims. Grain: one row per claim_id; latest load wins."
    columns:
      - name: claim_id
        description: "Business key of the claim."
        tests: [unique, not_null]
      - name: payer_id
        description: "Payer (insurer) that received the claim."
        tests:
          - relationships:
              arguments: {to: ref('stg_payers'), field: payer_id}
      - name: network_status
        tests:
          - accepted_values:
              arguments: {values: ['OON', 'INN']}
      - name: claim_status
        tests:
          - accepted_values:
              arguments: {values: ['SUBMITTED', 'PAID', 'DENIED', 'VOID']}
  - name: stg_remittances
    description: "835 remittance lines; reversals carry negative paid_amount."
    columns:
      - name: remit_line_id
        tests: [unique, not_null]
      - name: line_type
        tests:
          - accepted_values:
              arguments: {values: ['PAYMENT', 'PAYMENT_2ND', 'DENIAL', 'REVERSAL']}
  - name: stg_payers
    description: "Payers (insurers) with their contractual prompt-pay window in days."
    columns:
      - name: payer_id
        tests: [unique, not_null]
      - name: prompt_pay_days
        description: "Days the payer has to issue the first payment after submission."
        tests: [not_null]
